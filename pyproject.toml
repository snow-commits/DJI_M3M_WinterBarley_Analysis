[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m3m-multispectral"
version = "0.2.0"
description = "Label-free processing toolkit for DJI Mavic 3 Multispectral (M3M) imagery: radiometric calibration, vegetation indices, within-field relative zones and prescription maps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhide Ren" }]
keywords = [
    "remote-sensing",
    "multispectral",
    "uav",
    "drone",
    "dji",
    "mavic-3m",
    "precision-agriculture",
    "vegetation-index",
    "ndvi",
    "orthomosaic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    # tomllib is standard library from 3.11; older interpreters need the backport.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.scripts]
m3m = "m3m.cli:main"

[project.urls]
Repository = "https://github.com/snow-commits/DJI_M3M_WinterBarley_Analysis"
Issues = "https://github.com/snow-commits/DJI_M3M_WinterBarley_Analysis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
